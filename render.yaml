services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 3 --timeout 30 --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: eld-trip-planner-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the deployed frontend origin, e.g. https://eld-trip-planner.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: eld-trip-planner-db
          property: connectionString
      - key: NOMINATIM_USER_AGENT
        sync: false # e.g. "eld-trip-planner (you@example.com)" — required by Nominatim's usage policy
      - key: ORS_API_KEY
        sync: false # optional OpenRouteService fallback key, used if the OSRM demo server is unreachable

  - type: web
    name: eld-trip-planner
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the deployed backend origin, e.g. https://eld-trip-planner-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: eld-trip-planner-db
    plan: free
